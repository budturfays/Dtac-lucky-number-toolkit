name: Refresh lucky numbers

on:
  push:
    branches: [main]
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch: # allow manual run

permissions:
  contents: read

concurrency:
  group: production-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Pin the image so the scheduled job is not changed by the Ubuntu 26
    # migration announced for ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      # 1) Fetch True-dtac samples plus the complete AIS public listing
      - name: Fetch fresh data
        run: |
          python -m pip install --quiet -r requirements.txt
          python scripts/fetch_and_export.py

      # 2) Install dependencies
      - name: Install dependencies
        run: npm ci

      - name: Regression checks before production build
        run: |
          npm test
          python -m unittest discover -s scripts -p 'test_*.py'

      # 3) Build locally into .vercel/output (runs `npm run build` via vercel.json)
      #    and deploy that exact output with --prebuilt, so the fresh data from
      #    step 1 is what gets served (gitignored files aren't uploaded otherwise).
      - name: Pull Vercel project settings
        run: npx --yes vercel@58 pull --yes
        env:
          VERCEL_ORG_ID: team_nRdGzntRZAxuwv1ZxDUybLd3
          VERCEL_PROJECT_ID: prj_TXjIz88GHbYRw85KSKtaX3vdLzVA
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Guard: confirm the .vercel link created by `vercel pull` points at the
      # WEBAPP project (prj_TXjIz...). If it ever points elsewhere, the build
      # below would silently produce a static-only deploy for the wrong project
      # and clobber /api/buy on lucky-number-buy. Fail fast instead.
      - name: Verify webapp project link
        run: |
          python - <<'PY'
          import json
          d = json.load(open(".vercel/project.json", encoding="utf-8"))
          expected = "prj_TXjIz88GHbYRw85KSKtaX3vdLzVA"
          got = d.get("projectId")
          assert got == expected, (
              f"WRONG PROJECT LINK: .vercel/project.json points at {got!r}, "
              f"expected webapp {expected!r}. Refusing to build/deploy."
          )
          print("webapp project link OK ->", d.get("projectName"))
          PY

      - name: Build for Vercel
        run: npx --yes vercel@58 build --prod --yes
        env:
          VERCEL_ORG_ID: team_nRdGzntRZAxuwv1ZxDUybLd3
          VERCEL_PROJECT_ID: prj_TXjIz88GHbYRw85KSKtaX3vdLzVA
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # 4) Deploy to Vercel Hosting (production) via deploy_guard.py, which
      #    re-verifies the webapp/.vercel link points at lucky-number-web
      #    before running `vercel deploy`, so a cross-project clobber of
      #    lucky-number-buy is impossible even if the link goes stale.
      #    Requires a VERCEL_TOKEN secret: Vercel -> Account Settings -> Tokens
      #    -> Create Token (no expiry), then add it as a repo secret named
      #    VERCEL_TOKEN (Settings -> Secrets and variables -> Actions).
      - name: Deploy to Vercel (production, guarded)
        run: python ../deploy_guard.py webapp --prebuilt
        env:
          VERCEL_ORG_ID: team_nRdGzntRZAxuwv1ZxDUybLd3
          VERCEL_PROJECT_ID: prj_TXjIz88GHbYRw85KSKtaX3vdLzVA
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_BIN: npx --yes vercel@58

      # The buy API is a separate Vercel project. Keep its deployment explicit
      # and guarded so a webapp deploy can never clobber it, while ensuring the
      # endpoint checked below is actually present after a fresh checkout.
      - name: Pull Vercel buy project settings
        working-directory: vercel-fn
        run: npx --yes vercel@58 pull --yes --environment production
        env:
          VERCEL_ORG_ID: team_nRdGzntRZAxuwv1ZxDUybLd3
          VERCEL_PROJECT_ID: prj_DTqOVC4UCMSLDXQmuV1IEvPCE8Fn
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy buy API to Vercel (production, guarded)
        run: python ../deploy_guard.py vercel-fn
        env:
          VERCEL_ORG_ID: team_nRdGzntRZAxuwv1ZxDUybLd3
          VERCEL_PROJECT_ID: prj_DTqOVC4UCMSLDXQmuV1IEvPCE8Fn
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_BIN: npx --yes vercel@58

      # 5) Post-deploy health checks — fail the run loudly if the site or the
      #    buy function isn't serving correctly (e.g. a stray deploy clobbered
      #    /api/buy with a static-only build).
      - name: Health-check site
        run: |
          code=$(curl -s -o /tmp/site.html -w "%{http_code}" \
            https://lucky-number-web-lac.vercel.app/)
          echo "site status: $code"
          [ "$code" = "200" ] || { echo "SITE FAILED"; exit 1; }
          grep -q 'id="root"' /tmp/site.html || { echo "SITE MISSING ROOT"; exit 1; }

      - name: Health-check buy function
        run: |
          body=$(curl -s -w "\n%{http_code}" \
            https://lucky-number-buy.vercel.app/api/buy)
          code=$(echo "$body" | tail -n1)
          echo "buy fn status: $code"
          echo "$body" | grep -q '"ok":true' || { echo "BUY FN FAILED"; exit 1; }
          [ "$code" = "200" ] || { echo "BUY FN FAILED"; exit 1; }

      - name: Read-only production API and catalog checks
        run: node scripts/production-smoke.mjs
