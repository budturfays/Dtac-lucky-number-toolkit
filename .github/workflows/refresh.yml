name: Refresh lucky numbers

on:
  push:
    branches: [main]
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch: # allow manual run

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      # 1) Fetch fresh numbers from True's API and build the catalog JSON
      - name: Fetch fresh data
        run: |
          python -m pip install --quiet -r requirements.txt
          python scripts/fetch_and_export.py

      # 2) Install dependencies
      - name: Install dependencies
        run: npm ci

      # 3) Build locally into .vercel/output (runs `npm run build` via vercel.json)
      #    and deploy that exact output with --prebuilt, so the fresh data from
      #    step 1 is what gets served (gitignored files aren't uploaded otherwise).
      - name: Pull Vercel project settings
        run: npx --yes vercel@58 pull --yes
        env:
          VERCEL_ORG_ID: team_nRdGzntRZAxuwv1ZxDUybLd3
          VERCEL_PROJECT_ID: prj_TXjIz88GHbYRw85KSKtaX3vdLzVA
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        run: npx --yes vercel@58 build --prod --yes
        env:
          VERCEL_ORG_ID: team_nRdGzntRZAxuwv1ZxDUybLd3
          VERCEL_PROJECT_ID: prj_TXjIz88GHbYRw85KSKtaX3vdLzVA
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # 4) Deploy to Vercel Hosting (production)
      #    Requires a VERCEL_TOKEN secret: Vercel -> Account Settings -> Tokens
      #    -> Create Token (no expiry), then add it as a repo secret named
      #    VERCEL_TOKEN (Settings -> Secrets and variables -> Actions).
      - name: Deploy to Vercel (production)
        run: npx --yes vercel@58 deploy --prebuilt --prod --yes
        env:
          VERCEL_ORG_ID: team_nRdGzntRZAxuwv1ZxDUybLd3
          VERCEL_PROJECT_ID: prj_TXjIz88GHbYRw85KSKtaX3vdLzVA
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # 5) Post-deploy health checks — fail the run loudly if the site or the
      #    buy function isn't serving correctly (e.g. a stray deploy clobbered
      #    /api/buy with a static-only build).
      - name: Health-check site
        run: |
          code=$(curl -s -o /tmp/site.html -w "%{http_code}" \
            https://lucky-number-web-lac.vercel.app/)
          echo "site status: $code"
          [ "$code" = "200" ] || { echo "SITE FAILED"; exit 1; }
          grep -q 'id="root"' /tmp/site.html || { echo "SITE MISSING ROOT"; exit 1; }

      - name: Health-check buy function
        run: |
          body=$(curl -s -w "\n%{http_code}" \
            https://lucky-number-buy.vercel.app/api/buy)
          code=$(echo "$body" | tail -n1)
          echo "buy fn status: $code"
          echo "$body" | grep -q '"ok":true' || { echo "BUY FN FAILED"; exit 1; }
          [ "$code" = "200" ] || { echo "BUY FN FAILED"; exit 1; }
